name: Deploy OpenGym to Oracle VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar o deploy manualmente pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # 1. Garante que o diretório de deploy existe
            mkdir -p ~/opengym
            cd ~/opengym

            # 1. Sincroniza o docker-compose.yml atualizado
            git fetch origin main
            git reset --hard origin/main

            # 2. Injeta a variável do Cloudflare Tunnel
            export TUNNEL_TOKEN="${{ secrets.TUNNEL_TOKEN }}"

            # 3. Baixa as imagens oficiais mais recentes do registro GHCR
            docker compose pull

            # 4. Recria e sobe os containers em segundo plano
            docker compose up -d

            # 5. Remove imagens antigas não utilizadas para poupar disco
            docker image prune -f