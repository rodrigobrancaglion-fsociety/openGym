name: Deploy OpenGym to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Runs automatically every Sunday at 03:00 UTC to check for upstream image updates
    - cron: '0 3 * * 0'

concurrency:
  group: deploy-opengym-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      TARGET_DIR: '~/opengym'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_vps\n  BatchMode yes\n  StrictHostKeyChecking yes\n' \
            "$VPS_HOST" "$VPS_USER" "$VPS_PORT" > ~/.ssh/config

      - name: Upload application files to VPS
        run: |
          tar -czf - \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.idea' \
            --exclude='.agents' \
            --exclude='tmp' \
            api scripts docker-compose.vps.yml | ssh vps "set -euo pipefail; mkdir -p ${TARGET_DIR}; tar -xzf - -C ${TARGET_DIR}"

      - name: Deploy Docker Compose on VPS
        run: ssh vps "bash ${TARGET_DIR}/scripts/deploy.sh"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_vps
